[Locations]
# Path to loadout config. Can use relative path from here.
looks_config = ./appearance.cfg

# Path to python file. Can use relative path from here.
python_file = ./bot.py
requirements_file = ../requirements.txt

# Name of the bot in-game
name = susu_bot

# The maximum number of ticks per second that your bot wishes to receive.
maximum_tick_rate_preference = 120

[Details]
# These values are optional but useful metadata for helper programs
# Name of the bot's creator/developer
developer = Sullivan

# Short description of the bot
description = Bot Rocket League avec apprentissage par renforcement (RLGym C++ RocketSim + CUDA PPO + Architecture Hybride Susu)
    entraine aux mecaniques avancees: visee de balle, flip resets, musty flicks, double taps, aerials, pinches, speed flips et kickoffs Susu.

# Fun fact about the bot
fun_fact = susu_bot combine la visee multi-horizons (0.1s, 0.5s, 1s, 2s) et les kickoffs speedflip de Susu avec son propre modele neural TorchScript (susu-model.pt).

# Link to github repository
github = https://github.com/RLBot/RLBotPythonExample

# Programming language
language = python
tags = 1v1, susu, mechanics, aerial, flip-reset, musty
